# Publishes the PyPI package, then the server metadata, on a version tag.
# Follows the current MCP Registry guide:
# https://github.com/modelcontextprotocol/registry/blob/main/docs/modelcontextprotocol-io/github-actions.mdx
# mcp-publisher is pinned to a signed release and verified before it runs.
# The guide's sample still shows v1.8.1; v1.8.6 is the current signed release.

name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for PyPI trusted publishing and GitHub OIDC
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.6

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Run tests
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
          uv run pytest

      - name: Require the tag to match the published versions
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          uv run python - <<'PY'
          import json, os, pathlib, re, sys
          tag = os.environ["RELEASE_VERSION"].removeprefix("v")
          source = pathlib.Path("src/shelem_mcp/__init__.py").read_text(encoding="utf-8")
          package = re.search(r'__version__ = "([^"]+)"', source).group(1)
          server = json.loads(pathlib.Path("server.json").read_text(encoding="utf-8"))
          published = server["packages"][0]["version"]
          if not (tag == package == server["version"] == published):
              sys.exit(
                  f"tag {tag}, package {package}, "
                  f"server.json {server['version']} / {published}"
              )
          PY

      - name: Build the package
        run: uv build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
